name: Cập nhật bảng lọc cổ phiếu

on:
  schedule:
    # Giờ máy chủ là UTC (= giờ VN − 7). Thứ 2–6:
    - cron: "*/20 2-7 * * 1-5"   # mỗi 20 phút từ 9:00 đến 14:40 giờ VN
    - cron: "20 8 * * 1-5"       # 15:20 giờ VN, sau khi đóng cửa
  workflow_dispatch:              # nút "Run workflow" để chạy tay
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Giữ dữ liệu đã tải giữa các lần chạy: dùng lại khi nguồn lỗi, BCTC tự làm mới sau 72 giờ
      - uses: actions/cache@v4
        with:
          path: cache
          key: du-lieu-${{ github.run_id }}
          restore-keys: du-lieu-

      # Nguồn dữ liệu đôi khi từ chối máy chủ GitHub: thử lại tối đa 3 lần, cách nhau 90 giây
      - name: Chạy bộ lọc
        run: |
          for i in 1 2 3; do
            python loc_co_phieu.py --web site && exit 0
            echo "Lần $i thất bại, thử lại sau 90 giây..."
            sleep 90
          done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
